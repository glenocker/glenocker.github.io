    <circle cx="160" cy="130" r="54" fill="none" stroke="#d6e7ff" stroke-width="14" opacity="0.92"/>
    <circle cx="300" cy="130" r="54" fill="none" stroke="#d6e7ff" stroke-width="14" opacity="0.92"/>
    <line x1="214" y1="130" x2="246" y2="130" stroke="#d6e7ff" stroke-width="14" stroke-linecap="round"/>
    <line x1="354" y1="130" x2="430" y2="130" stroke="#d6e7ff" stroke-width="14" stroke-linecap="round"/>
    <rect x="430" y="100" width="180" height="60" rx="10" fill="none" stroke="#d6e7ff" stroke-width="10" opacity="0.92"/>
